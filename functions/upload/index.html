<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload transcripts</title>
    <style>
      :root { color-scheme: light; }
      body { font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; color: #1c2430; }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1.25rem 0; }
      button { font: inherit; background: #1c2430; color: white; border: 0; border-radius: 6px; padding: 0.45rem 0.9rem; }
      button:disabled { opacity: 0.6; }
      #status { min-height: 1.5rem; }
      .ok { color: #1f6b34; }
      .bad { color: #8e2f2a; }
      ul { padding-left: 1.2rem; }
      code { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Upload transcripts</h1>
    <p>Choose text or JSON transcripts. This page sends them to the local server, which stores them in <code>incomingtranscripts</code> and scores them. A successful file moves to <code>processedtranscripts</code>.</p>
    <form id="form">
      <label>
        Transcript files
        <input id="files" type="file" multiple accept=".txt,.text,.md,.json,text/plain,text/markdown,application/json" />
      </label>
      <button type="submit">Upload</button>
    </form>
    <p id="status" role="status"></p>
    <div id="report"></div>
    <script>
      const form = document.querySelector("#form");
      const input = document.querySelector("#files");
      const status = document.querySelector("#status");
      const report = document.querySelector("#report");
      const button = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        report.replaceChildren();
        const chosen = [...input.files];
        if (!chosen.length) {
          setStatus("Choose at least one transcript.", false);
          return;
        }
        button.disabled = true;
        setStatus("Uploading…", true);
        try {
          const files = await Promise.all(chosen.map(encodeFile));
          const response = await fetch("/upload", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ files }),
          });
          const text = await response.text();
          if (!response.ok) {
            setStatus(text || "Upload failed.", false);
            return;
          }
          showReport(JSON.parse(text));
        } catch (error) {
          setStatus(error instanceof Error ? error.message : "Upload failed.", false);
        } finally {
          button.disabled = false;
        }
      });

      async function encodeFile(file) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return { name: file.name, contentType: file.type || "", body: btoa(binary) };
      }

      function setStatus(message, ok) {
        status.textContent = message;
        status.className = ok ? "ok" : "bad";
      }

      function showReport(summary) {
        const scored = summary.scored || [];
        const failed = summary.failed || [];
        const rejected = summary.rejected || [];
        setStatus(scored.length ? "Scored " + scored.length + "." : "Nothing was scored.", scored.length > 0 && failed.length === 0 && rejected.length === 0);
        const list = document.createElement("ul");
        for (const name of scored) addItem(list, name + " moved to processedtranscripts.", true);
        for (const item of failed) addItem(list, item.file + ": " + item.error, false);
        for (const item of rejected) addItem(list, item.file + ": " + item.error, false);
        if (list.childNodes.length) report.append(list);
      }

      function addItem(list, text, ok) {
        const item = document.createElement("li");
        item.textContent = text;
        item.className = ok ? "ok" : "bad";
        list.append(item);
      }
    </script>
  </body>
</html>
